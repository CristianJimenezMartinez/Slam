<!-- TABLA EDITORIAL DE CLASIFICADOS (Del 4º puesto en adelante) -->
<div class="leaderboard-grid" *ngIf="resultados.length > 0">
  <div class="leaderboard-row" *ngFor="let res of resultados">
    
    <!-- Posición Ordinal -->
    <div class="rank-pos">
      <span>{{ res.posicion < 10 ? '0' + res.posicion : res.posicion }}</span>
    </div>

    <!-- Avatar del Poeta -->
    <div class="avatar-cell">
      <img [src]="res.foto_url || 'assets/default-avatar.jpg'" [alt]="res.participante" class="poet-avatar">
    </div>

    <!-- Información del Poeta: Nombre Completo y Votos -->
    <div class="poet-cell">
      <span class="poet-name">{{ res.participante }}</span>
      <span class="poet-votes">{{ res.num_votos }} votos</span>
    </div>

    <!-- Calificación Numérica sobre 10 -->
    <div class="score-cell">
      <span class="score-val">{{ res.puntuacion_media | number:'1.2-2' }}</span>
      <span class="score-max">/ 10</span>
    </div>

    <!-- Barra Láser de Nivel Métrica (Fina y Elegante) -->
    <div class="level-track">
      <div class="level-fill" [style.width.%]="res.puntuacion_media * 10"></div>
    </div>

  </div>
</div>
