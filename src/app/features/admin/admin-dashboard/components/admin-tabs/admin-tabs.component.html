<nav class="dashboard-tabs">
  <div class="tabs-group">
    <button 
      class="tab-btn"
      [class.active]="activeTab === 'live'" 
      (click)="setTab('live')">
      <span class="live-pulse-dot"></span>
      <span>Slam Live</span>
    </button>
    <button 
      class="tab-btn"
      [class.active]="activeTab === 'eventos'" 
      (click)="setTab('eventos')">
      <svg class="tab-svg" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>Eventos Próximos</span>
    </button>
    <button 
      class="tab-btn"
      [class.active]="activeTab === 'anteriores'" 
      (click)="setTab('anteriores')">
      <svg class="tab-svg" viewBox="0 0 24 24">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
      </svg>
      <span>Historial</span>
    </button>
    <button 
      class="tab-btn"
      [class.active]="activeTab === 'temporada'" 
      (click)="setTab('temporada')">
      <svg class="tab-svg" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 2a10 10 0 0 0 0 20"></path>
      </svg>
      <span>Temporada & Marca</span>
    </button>
  </div>

  <div class="tabs-actions" *ngIf="activeTab === 'eventos'">
    <button class="btn-new-event" (click)="onNewEvent()">
      <svg class="btn-svg" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Nuevo Evento</span>
    </button>
  </div>
</nav>
