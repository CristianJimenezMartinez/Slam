<app-loading-spinner *ngIf="loading"></app-loading-spinner>

<ng-container *ngIf="eventos$ | async as res">
  <div class="event-grid" *ngIf="!loading">
    
    <div class="no-events" *ngIf="res.data.length === 0">
      <svg class="no-events-svg" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <p>No hay eventos registrados en esta sección.</p>
    </div>

    <div class="event-card glass" *ngFor="let evento of res.data" [class.is-live]="evento.votacion_activa">
      <div class="card-laser-beam"></div>

      <div class="event-info">
        <div class="badges-row">
          <span class="status-badge portada-badge" *ngIf="evento.activo">
            <svg viewBox="0 0 24 24" class="badge-svg"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <span>EN PORTADA</span>
          </span>
          <span class="status-badge locked-badge" *ngIf="isEventLocked(evento)">
            <svg viewBox="0 0 24 24" class="badge-svg"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            <span>HISTORIAL</span>
          </span>
          <span class="status-badge upcoming-badge" *ngIf="!isEventLocked(evento)">
            <svg viewBox="0 0 24 24" class="badge-svg"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span>PRÓXIMO</span>
          </span>
          <span class="status-badge live-badge" *ngIf="evento.votacion_activa">
            <span class="pulse-dot"></span>
            <span>VOTOS EN VIVO</span>
          </span>
        </div>

        <h3 class="event-title">{{ evento.nombre }}</h3>
        <p class="event-date">
          <svg viewBox="0 0 24 24" class="date-svg"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span>{{ evento.fecha | date:'fullDate' }} · {{ evento.fecha | date:'shortTime' }}</span>
        </p>
      </div>

      <div class="event-actions">
        
        <!-- BOTÓN PORTADA -->
        <button class="action-btn toggle-portada-btn" [class.is-active]="evento.activo" (click)="toggleActivo(evento)">
          <svg viewBox="0 0 24 24" class="btn-svg"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          <span>{{ evento.activo ? 'Quitar de Portada' : 'Fijar en Portada' }}</span>
        </button>
        
        <ng-container *ngIf="!isEventLocked(evento)">
          <!-- BOTÓN ABRIR/CERRAR VOTOS -->
          <button class="action-btn toggle-vote-btn" [class.voting-open]="evento.votacion_activa" (click)="toggleVotacion(evento)">
            <svg viewBox="0 0 24 24" class="btn-svg" *ngIf="!evento.votacion_activa"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <svg viewBox="0 0 24 24" class="btn-svg" *ngIf="evento.votacion_activa"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            <span>{{ evento.votacion_activa ? 'Cerrar Votaciones' : 'Abrir Votaciones en Vivo' }}</span>
          </button>

          <!-- FILA DE ACCIONES EDITAR / DIRECTO / ELIMINAR -->
          <div class="actions-row">
            <button class="action-btn edit-live-btn" (click)="evento.votacion_activa ? controlLive.emit() : edit.emit(evento)" [class.live-mode]="evento.votacion_activa">
              <svg viewBox="0 0 24 24" class="btn-svg" *ngIf="!evento.votacion_activa"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              <span class="live-dot" *ngIf="evento.votacion_activa"></span>
              <span>{{ evento.votacion_activa ? 'Control Directo' : 'Editar' }}</span>
            </button>

            <button class="action-btn delete-btn" (click)="deleteEvento(evento.id)" title="Eliminar evento">
              <svg viewBox="0 0 24 24" class="btn-svg"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>

          <!-- BOTÓN IMPRIMIR QRS -->
          <a [routerLink]="['/admin/imprimir-qrs', evento.id]" target="_blank" class="action-btn print-qr-btn">
            <svg viewBox="0 0 24 24" class="btn-svg"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            <span>Imprimir Tarjetas QR</span>
          </a>
        </ng-container>

        <div class="locked-message" *ngIf="isEventLocked(evento)">
          <svg viewBox="0 0 24 24" class="lock-svg"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span>Evento finalizado. Archivo histórico protegido.</span>
        </div>

      </div>
    </div>
  </div>
</ng-container>
