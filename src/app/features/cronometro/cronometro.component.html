<div #cronometroRoot class="cronometro-stage" [ngClass]="['phase-' + currentPhase, isFullscreen ? 'fullscreen-mode' : '']">
  
  <!-- AMBIENTE CINEMATOGRÁFICO DE FONDO -->
  <div class="stage-ambient-glow"></div>
  <div class="stage-vignette"></div>

  <div class="stage-container">
    
    <!-- SUBCOMPONENTE 1: HEADER & PRESETS -->
    <app-cronometro-header
      [timerRunning]="timerRunning"
      [timerMode]="timerMode"
      [soundEnabled]="soundEnabled"
      [isFullscreen]="isFullscreen"
      [presets]="PRESETS"
      [activePreset]="activePreset"
      (modeChange)="setMode($event)"
      (soundToggle)="toggleSound()"
      (fullscreenToggle)="toggleFullscreen()"
      (presetSelect)="selectPreset($event)">
    </app-cronometro-header>

    <!-- CUERPO PRINCIPAL DEL CRONÓMETRO -->
    <main class="stage-dial-arena">
      <div class="dial-card glass">
        
        <!-- SUBCOMPONENTE 2: RADIAL DIAL & DÍGITOS -->
        <app-cronometro-dial
          [currentPhase]="currentPhase"
          [phaseText]="phaseText"
          [minutesDisplay]="minutesDisplay"
          [secondsDisplay]="secondsDisplay"
          [decimasDisplay]="decimasDisplay"
          [penaltyPoints]="penaltyPoints"
          [timerMode]="timerMode"
          [activePresetName]="activePreset.name"
          [circleRadius]="circleRadius"
          [circleCircumference]="circleCircumference"
          [dashOffset]="dashOffset"
          [isFullscreen]="isFullscreen">
        </app-cronometro-dial>

        <!-- SUBCOMPONENTE 3: BOTONES Y CONTROLES DENTRO DE LA TARJETA -->
        <app-cronometro-controls
          [timerRunning]="timerRunning"
          [elapsedMs]="elapsedMs"
          [currentPhase]="currentPhase"
          [isFullscreen]="isFullscreen"
          (toggle)="toggleTimer()"
          (reset)="resetTimer()"
          (adjustSeconds)="addSeconds($event)">
        </app-cronometro-controls>

      </div>
    </main>

    <!-- SUBCOMPONENTE 4: GUÍA DE REGLAMENTO -->
    <app-cronometro-rules *ngIf="!isFullscreen"></app-cronometro-rules>

  </div>
</div>
