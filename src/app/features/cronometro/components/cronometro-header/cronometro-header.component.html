<header class="stage-header">
  <div class="header-top-row">
    <div class="brand-pill">
      <span class="pulse-live" [class.running]="timerRunning"></span>
      <span>POETRY SLAM ALICANTE · CRONÓMETRO DE ESCENARIO</span>
    </div>

    <div class="quick-toggles">
      <!-- Toggle Modo: Directo / Cuenta Atrás -->
      <button (click)="onToggleMode()" class="tool-btn" [title]="timerMode === 'countup' ? 'Cambiar a Cuenta Atrás' : 'Cambiar a Tiempo Directo'">
        <svg class="tool-svg" viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 16h5v5"/>
        </svg>
        <span class="tool-label">{{ timerMode === 'countup' ? 'Directo' : 'Atrás' }}</span>
      </button>

      <!-- Toggle Sonido -->
      <button (click)="onToggleSound()" class="tool-btn" [class.muted]="!soundEnabled" [title]="soundEnabled ? 'Silenciar avisos' : 'Activar avisos sonoros'">
        <svg *ngIf="soundEnabled" class="tool-svg" viewBox="0 0 24 24">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <svg *ngIf="!soundEnabled" class="tool-svg" viewBox="0 0 24 24">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
        <span class="tool-label">{{ soundEnabled ? 'Audio ON' : 'Audio OFF' }}</span>
      </button>

      <!-- Toggle Pantalla Completa / Modo Proyector -->
      <button (click)="onToggleFullscreen()" class="tool-btn fullscreen-btn" title="Modo Proyector / Pantalla Completa (F)">
        <svg *ngIf="!isFullscreen" class="tool-svg" viewBox="0 0 24 24">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <svg *ngIf="isFullscreen" class="tool-svg" viewBox="0 0 24 24">
          <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
        </svg>
        <span class="tool-label">{{ isFullscreen ? 'Salir' : 'Proyector' }}</span>
      </button>
    </div>
  </div>

  <!-- SELECTOR DE PRESETS -->
  <div class="presets-row" *ngIf="!isFullscreen">
    <button *ngFor="let p of presets" 
            class="preset-chip" 
            [class.active]="activePreset.id === p.id"
            (click)="onSelectPreset(p)">
      <span class="preset-icon">{{ p.icon }}</span>
      <div class="preset-text">
        <strong>{{ p.name }}</strong>
        <small>{{ p.subtitle }}</small>
      </div>
    </button>
  </div>
</header>
