<div class="auth-stage-wrapper">
  
  <!-- PANTALLA DE CARGA GLOBAL POR ENCIMA DE TODO -->
  <app-loading-spinner *ngIf="loading" [fullScreen]="true"></app-loading-spinner>

  <!-- FONDO CINEMATOGRÁFICO FIJO (CABINA DE CONTROL & BACKSTAGE) -->
  <div class="hero-bg-container">
    <img src="assets/images/login_hero.jpg" alt="Cabina de Control Poetry Slam Alicante" class="hero-bg-img">
  </div>
  <div class="hero-overlay"></div>

  <div class="auth-container">
    <div class="auth-card glass">
      
      <!-- LÍNEA LÁSER SUPERIOR -->
      <div class="card-laser-beam"></div>

      <!-- BRAND PILL DE CONTROL -->
      <div class="brand-pill">
        <span class="lock-indicator">
          <svg viewBox="0 0 24 24" class="svg-icon-xs">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </span>
        <span>POETRY SLAM ALICANTE · PANEL DE CONTROL</span>
      </div>

      <!-- CABECERA -->
      <div class="auth-header">
        <h1 class="glow-title">INICIAR SESIÓN</h1>
        <p class="auth-subtitle">ACCESO EXCLUSIVO A LA ORGANIZACIÓN</p>
      </div>

      <!-- FORMULARIO -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
        
        <!-- CAMPO EMAIL -->
        <div class="form-group" [class.has-error]="form.get('email')?.touched && form.get('email')?.invalid">
          <label for="email">
            <svg viewBox="0 0 24 24" class="label-svg">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <span>Correo Electrónico</span>
          </label>
          <div class="input-wrapper">
            <input 
              id="email" 
              type="email" 
              formControlName="email" 
              placeholder="admin@poetryslamalicante.com" 
              autocomplete="email" />
          </div>
          <small class="field-error-msg" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')">
            El correo electrónico es obligatorio
          </small>
          <small class="field-error-msg" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')">
            Introduce un formato de email válido
          </small>
        </div>

        <!-- CAMPO CONTRASEÑA -->
        <div class="form-group" [class.has-error]="form.get('password')?.touched && form.get('password')?.invalid">
          <label for="password">
            <svg viewBox="0 0 24 24" class="label-svg">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>Contraseña</span>
          </label>
          <div class="input-wrapper">
            <input 
              id="password" 
              [type]="showPassword ? 'text' : 'password'" 
              formControlName="password" 
              placeholder="••••••••••••" 
              autocomplete="current-password" />
            
            <button 
              type="button" 
              class="btn-toggle-password" 
              (click)="togglePasswordVisibility()" 
              [title]="showPassword ? 'Ocultar contraseña' : 'Ver contraseña'"
              tabindex="-1">
              <!-- Eye open -->
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" class="eye-svg">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye off -->
              <svg *ngIf="showPassword" viewBox="0 0 24 24" class="eye-svg">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <small class="field-error-msg" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('required')">
            La contraseña es obligatoria
          </small>
          <small class="field-error-msg" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('minlength')">
            Debe contener al menos 6 caracteres
          </small>
        </div>

        <!-- MENSAJE DE ERROR GLOBAL -->
        <div class="auth-error-banner" *ngIf="errorMessage">
          <svg viewBox="0 0 24 24" class="error-svg">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- BOTÓN ENTRAR -->
        <button type="submit" class="btn-auth-submit" [disabled]="loading || form.invalid">
          <svg viewBox="0 0 24 24" class="btn-svg">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span>ACCEDER AL PANEL</span>
        </button>

        <!-- RETORNO AL SITIO PÚBLICO -->
        <div class="auth-footer-nav">
          <a routerLink="/" class="back-link">
            <svg viewBox="0 0 24 24" class="back-svg">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Volver a la web principal</span>
          </a>
        </div>

      </form>

    </div>
  </div>
</div>
